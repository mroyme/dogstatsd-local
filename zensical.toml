[project]
site_name = "dogstatsd-local"
site_description = "A local DogStatsD protocol inspector for debugging metrics, service checks, and events"
site_url = "https://mroyme.github.io/dogstatsd-local/"
repo_name = "mroyme/dogstatsd-local"
repo_url = "https://github.com/mroyme/dogstatsd-local"
copyright = "Copyright &copy; 2026 Madhurjya Roy"
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Configuration" = "configuration.md" },
  { "Connecting Your Service" = "connecting.md" },
  { "Output Formats" = "output-formats.md" },
  { "Forwarding" = "forwarding.md" },
  { "Protocol Reference" = "protocol.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
]

[[project.theme.palette]]
accent = "deep purple"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "deep purple"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.toc]
permalink = true
