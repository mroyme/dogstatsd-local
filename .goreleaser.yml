version: 2

project_name: dogstatsd-local

before:
  hooks:
    - go mod tidy

# https://goreleaser.com/customization/build
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # ensures mod timestamp to be the commit timestamp
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -tags=netgo
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }} # use commit date instead of current date as main.date
    id: dogstatsd-local
    main: ./cmd/dogstatsd-local/main.go
    binary: dogstatsd-local

# https://goreleaser.com/customization/source/
source:
  enabled: true
  name_template: "{{ .ProjectName }}.src"

# https://goreleaser.com/customization/package/archives/
archives:
  - formats: 
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitTimestamp }}"

# https://goreleaser.com/customization/sbom
sboms:
  - artifacts: archive
  - id: source # Two different sbom configurations need two different IDs
    artifacts: source

# https://goreleaser.com/customization/checksum
checksum:
  name_template: "checksums.txt"

# https://goreleaser.com/customization/sign
signs:
- cmd: cosign
  signature: "${artifact}.sigstore.json"
  args:
    - sign-blob
    - "--bundle=${signature}"
    - "${artifact}"
    - "--yes"
  artifacts: checksum
  output: true

# https://goreleaser.com/customization/dockers_v2
dockers_v2:
  - images:
      - docker.io/mroyme/dogstatsd-local
      - ghcr.io/mroyme/dogstatsd-local
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    dockerfile: Dockerfile.goreleaser
    annotations: &image-spec
      # https://specs.opencontainers.org/image-spec/annotations
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.authors: Madhurjya Roy <m@mroy.me>
      org.opencontainers.image.url: https://github.com/mroyme/dogstatsd-local
      org.opencontainers.image.documentation: https://mroyme.github.io/dogstatsd-local/
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.vendor: Madhurjya Roy
      org.opencontainers.image.licenses: MIT
      # The following is not applicable for this project
      # org.opencontainers.image.ref.name: REF_NAME
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.description: A local DogStatsD protocol inspector for debugging metrics, service checks, and events
      # The following annotations don't make sense when image is "FROM scratch"
      # org.opencontainers.image.base.digest: BASE_DIGEST
      # org.opencontainers.image.base.name: BASE_NAME
    labels: *image-spec

# https://goreleaser.com/customization/docker_sign
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

# https://goreleaser.com/customization/publish/homebrew_casks
homebrew_casks:
  - name: dogstatsd-local
    binaries: [dogstatsd-local]
    description: Local DogStatsD protocol inspector for debugging metrics and events
    homepage: https://github.com/mroyme/dogstatsd-local
    repository:
      owner: mroyme
      name: homebrew-tap
      branch: dogstatsd-local-{{ .Version }}
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: mroyme
          name: homebrew-tap
          branch: main
    hooks:
      post:
        install: |-
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dogstatsd-local"]
          end

# https://goreleaser.com/customization/publish/changelog
changelog:
  use: github-native

# https://goreleaser.com/customization/publish/scm
release:
  github:
    owner: mroyme
    name: dogstatsd-local
