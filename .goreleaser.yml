version: 2

project_name: dogstatsd-local

before:
  hooks:
    - go mod tidy

builds:
  - id: dogstatsd-local
    main: ./cmd/dogstatsd-local/main.go
    binary: dogstatsd-local
    flags:
      - -trimpath
      - -tags=netgo
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

dockers_v2:
  - images:
      - docker.io/mroyme/dogstatsd-local
      - ghcr.io/mroyme/dogstatsd-local
    dockerfile: Dockerfile.goreleaser
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    labels: &oci-metadata
      org.opencontainers.image.title: dogstatsd-local
      org.opencontainers.image.description: A local DogStatsD protocol inspector for debugging metrics, service checks, and events
      org.opencontainers.image.source: https://github.com/mroyme/dogstatsd-local
      org.opencontainers.image.url: https://github.com/mroyme/dogstatsd-local
      org.opencontainers.image.documentation: https://mroyme.github.io/dogstatsd-local/
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.authors: Madhurjya Roy <m@mroy.me>
      org.opencontainers.image.vendor: Madhurjya Roy
    annotations: *oci-metadata

docker_signs:
  - cmd: cosign
    args:
      - sign
      - --yes
      - --registry-referrers-mode=oci-1-1
      - "${artifact}"
    env:
      - COSIGN_EXPERIMENTAL=1

brews:
  - repository:
      name: mroyme/homebrew-tap
      branch: main

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.spdx.json"

signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    args:
      - sign-blob
      - --yes
      - "${artifact}"
      - --output-certificate=${certificate}
      - --output-signature=${signature}

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^mise:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mroyme
    name: dogstatsd-local
  footer: |

    ---

    **Full Changelog**: https://github.com/mroyme/dogstatsd-local/compare/{{ .PreviousTag }}...{{ .Tag }}
