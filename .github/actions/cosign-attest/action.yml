name: 'Cosign Sign & Attest'
description: 'Sign and attest a container image for a single registry'

inputs:
  image:
    description: 'Full image name (e.g. ghcr.io/mroyme/dogstatsd-local)'
    required: true
  digest:
    description: 'Image digest (sha256:...)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v2.2.4'

    - name: Install syft
      uses: anchore/sbom-action/download-syft@v0.24.0

    - name: Sign the published Docker image
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "1"
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
      run: cosign sign --yes --registry-referrers-mode oci-1-1 "${IMAGE}@${DIGEST}"

    - name: Generate SBOM
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
      run: syft "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

    - name: Attest provenance
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true

    - name: Attest SBOM
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: sbom.spdx.json
        push-to-registry: true