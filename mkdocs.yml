site_name: dogstatsd-local
site_description: A local DogStatsD protocol inspector for debugging metrics, service checks, and events
site_url: https://mroyme.github.io/dogstatsd-local/
repo_name: mroyme/dogstatsd-local
repo_url: https://github.com/mroyme/dogstatsd-local

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Output Formats: output-formats.md
  - Forwarding: forwarding.md
  - Protocol Reference: protocol.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
